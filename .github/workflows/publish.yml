name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: staging
            api: https://api.staging.agele.xyz
            ws: wss://api.staging.agele.xyz/ws
          - environment: production
            api: https://api.agele.xyz
            ws: wss://api.agele.xyz/ws
    # NEXT_PUBLIC_* is inlined at build time, so each environment gets its own image.
    # Set the Privy and RPC values as variables on the matching GitHub environment.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=${{ matrix.environment }}-sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # A rerun must not replace an image that is already published under this tag.
      - id: exists
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.sha }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Tags never move; jog01/agele-infra pins image.webTag to <environment>-sha-<commit>.
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.published == 'false'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ matrix.api }}
            NEXT_PUBLIC_WS_URL=${{ matrix.ws }}
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}
            NEXT_PUBLIC_PRIVY_CLIENT_ID=${{ vars.NEXT_PUBLIC_PRIVY_CLIENT_ID }}
            NEXT_PUBLIC_SOLANA_CLUSTER=mainnet-beta
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.environment }}
          cache-to: type=gha,mode=max,scope=${{ matrix.environment }}
          provenance: true
